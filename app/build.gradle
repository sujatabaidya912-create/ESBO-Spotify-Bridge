
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.esbo.spotifybridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.esbo.spotifybridge'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(
        RepositoriesMode.FAIL_ON_PROJECT_REPOS
    )
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'ESBO-Spotify-Bridge'
include ':app'
    
}
