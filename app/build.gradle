
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.esbo.spotifybridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.esbo.spotifybridge'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
